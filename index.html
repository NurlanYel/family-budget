<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Семейный бюджет">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968890.png">
  
  <title>Семейный бюджет</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body { font-family: system-ui, sans-serif; font-size: 16px; }
    .tab-active { border-bottom: 4px solid #10b981; font-weight: 700; }
    .day-header { background: #1f2937; padding: 14px 16px; border-radius: 9999px; margin-bottom: 16px; font-weight: 700; }
    button { min-height: 52px; }
    input, select { font-size: 16px; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24">

  <div class="max-w-lg mx-auto">
    <div class="bg-gray-900 p-5 flex items-center justify-between sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-wallet text-4xl text-emerald-500"></i>
        <h1 class="text-2xl font-bold">Семейный бюджет</h1>
      </div>
      <button onclick="addTransaction()" class="bg-emerald-600 px-7 py-4 rounded-3xl flex items-center gap-3 text-base font-medium active:bg-emerald-700">
        <i class="fa-solid fa-plus"></i> НОВАЯ
      </button>
    </div>

    <div class="flex bg-gray-900 border-b border-gray-700 text-base overflow-x-auto sticky top-[73px] z-50">
      <button onclick="showTab(0)" class="tab tab-active flex-1 py-4" id="tab0">Дашборд</button>
      <button onclick="showTab(1)" class="tab flex-1 py-4" id="tab1">Транзакции</button>
      <button onclick="showTab(2)" class="tab flex-1 py-4" id="tab2">Балансы</button>
      <button onclick="showTab(3)" class="tab flex-1 py-4" id="tab3">Категории</button>
    </div>

    <div class="p-4" id="main-content"></div>
  </div>

  <div class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-gray-900 border-t border-gray-700 p-4 flex gap-3 z-50">
    <button onclick="exportData()" class="flex-1 bg-gray-800 py-4 rounded-3xl flex items-center justify-center gap-2 text-base font-medium">
      <i class="fa-solid fa-download"></i> Экспорт
    </button>
    <button onclick="importData()" class="flex-1 bg-gray-800 py-4 rounded-3xl flex items-center justify-center gap-2 text-base font-medium">
      <i class="fa-solid fa-upload"></i> Импорт
    </button>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/90 flex items-end z-50">
    <div class="bg-gray-900 rounded-t-3xl w-full max-w-lg p-6" id="modal-content"></div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('familyBudget')) || [];
    let expenseCategories = JSON.parse(localStorage.getItem('expenseCats')) || ["Дом","Коммунальные","Ирина","Продукты","Машина","Одежда / Вещи","Школа / ВУЗ","Спорт / Кружки","Развлечения / Подарки","Услуги 3 лиц","Такси","Аптека / Врачи","Business Ideas","Прочие"];
    let incomeCategories = JSON.parse(localStorage.getItem('incomeCats')) || ["Salary","Bonus","Per diem","Other"];

    let balances = JSON.parse(localStorage.getItem('balances')) || {
      cardNames: ["Карта 1", "Карта 2", "Карта 3", "Карта 4"],
      depositNames: ["Депозит 1", "Депозит 2", "Депозит 3", "Депозит 4"],
      cards: Array(4).fill().map(() => ({kzt: 0, usd: 0})),
      deposits: Array(4).fill().map(() => ({kzt: 0, usd: 0}))
    };

    function saveData() {
      localStorage.setItem('familyBudget', JSON.stringify(transactions));
      localStorage.setItem('expenseCats', JSON.stringify(expenseCategories));
      localStorage.setItem('incomeCats', JSON.stringify(incomeCategories));
      localStorage.setItem('balances', JSON.stringify(balances));
    }

    function formatNumber(num) {
      return Number(num).toLocaleString('ru-RU');
    }

    function showTab(n) {
      document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('tab-active', i === n));
      const content = document.getElementById('main-content');
      if (n === 0) renderDashboard(content);
      if (n === 1) renderTransactions(content);
      if (n === 2) renderBalances(content);
      if (n === 3) renderCategories(content);
    }

    function renderDashboard(content) {
      let income = 0, expense = 0;
      transactions.forEach(t => t.type === 'income' ? income += +t.amount : expense += +t.amount);
      content.innerHTML = `
        <div class="space-y-5">
          <div class="bg-gray-900 rounded-3xl p-6">
            <p class="text-emerald-400">Доходы</p>
            <p class="text-5xl font-bold">${formatNumber(income)} ₸</p>
          </div>
          <div class="bg-gray-900 rounded-3xl p-6">
            <p class="text-red-400">Расходы</p>
            <p class="text-5xl font-bold">${formatNumber(expense)} ₸</p>
          </div>
          <div class="bg-gray-900 rounded-3xl p-6">
            <p class="text-lg">Баланс</p>
            <p class="text-5xl font-bold ${(income-expense)>=0 ? 'text-emerald-400' : 'text-red-400'}">${formatNumber(income-expense)} ₸</p>
          </div>
        </div>`;
    }

    function renderTransactions(content) {
      if (transactions.length === 0) {
        content.innerHTML = `<p class="text-center text-gray-400 py-20">Пока нет транзакций</p>`;
        return;
      }
      let html = `<h2 class="text-xl mb-4">Все транзакции (${transactions.length})</h2>`;
      const grouped = {};
      transactions.forEach(t => {
        if (!grouped[t.date]) grouped[t.date] = [];
        grouped[t.date].push(t);
      });
      Object.keys(grouped).sort().reverse().forEach(date => {
        html += `<div class="day-header">${new Date(date).toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'})}</div>`;
        grouped[date].forEach(t => {
          const idx = transactions.findIndex(tr => tr.id === t.id);
          html += `
            <div class="bg-gray-900 rounded-3xl p-5 mb-4">
              <div class="flex justify-between">
                <div class="flex-1">
                  <p class="font-medium">${t.description || t.category}</p>
                  <p class="text-sm text-gray-400">${t.category}</p>
                </div>
                <p class="text-2xl font-semibold ${t.type === 'income' ? 'text-emerald-400' : 'text-red-400'}">
                  ${t.type === 'income' ? '+' : '-'}${formatNumber(t.amount)} ₸
                </p>
              </div>
              <div class="grid grid-cols-2 gap-3 mt-5">
                <button onclick="editTransaction(${idx})" class="py-4 bg-blue-900 rounded-2xl text-blue-300">✏️ Изменить</button>
                <button onclick="deleteTransaction(${idx})" class="py-4 bg-red-900 rounded-2xl text-red-300">🗑️ Удалить</button>
              </div>
            </div>`;
        });
      });
      content.innerHTML = html;
    }

    function renderBalances(content) {
      let html = `<h2 class="text-xl mb-6">Балансы</h2>`;

      html += `<h3 class="text-emerald-400 mb-4">Карты</h3>`;
      for (let i = 0; i < 4; i++) {
        html += `
          <div class="bg-gray-900 rounded-3xl p-5 mb-6">
            <input value="${balances.cardNames[i]}" class="bg-transparent w-full text-xl font-medium outline-none" onchange="updateBalanceName('card', ${i}, this.value)">
            <div class="grid grid-cols-2 gap-4 mt-4">
              <div>
                <p class="text-xs text-gray-400">KZT</p>
                <input type="number" step="0.01" value="${balances.cards[i].kzt}" class="w-full bg-gray-800 p-4 rounded-2xl text-lg" onchange="updateBalanceValue('card', ${i}, 'kzt', this.value)">
                <p class="text-sm text-gray-400 mt-1">${formatNumber(balances.cards[i].kzt)} ₸</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">USD</p>
                <input type="number" step="0.01" value="${balances.cards[i].usd}" class="w-full bg-gray-800 p-4 rounded-2xl text-lg" onchange="updateBalanceValue('card', ${i}, 'usd', this.value)">
                <p class="text-sm text-gray-400 mt-1">${formatNumber(balances.cards[i].usd)} $</p>
              </div>
            </div>
          </div>`;
      }

      html += `<h3 class="text-emerald-400 mt-8 mb-4">Депозиты</h3>`;
      for (let i = 0; i < 4; i++) {
        html += `
          <div class="bg-gray-900 rounded-3xl p-5 mb-6">
            <input value="${balances.depositNames[i]}" class="bg-transparent w-full text-xl font-medium outline-none" onchange="updateBalanceName('deposit', ${i}, this.value)">
            <div class="grid grid-cols-2 gap-4 mt-4">
              <div>
                <p class="text-xs text-gray-400">KZT</p>
                <input type="number" step="0.01" value="${balances.deposits[i].kzt}" class="w-full bg-gray-800 p-4 rounded-2xl text-lg" onchange="updateBalanceValue('deposit', ${i}, 'kzt', this.value)">
                <p class="text-sm text-gray-400 mt-1">${formatNumber(balances.deposits[i].kzt)} ₸</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">USD</p>
                <input type="number" step="0.01" value="${balances.deposits[i].usd}" class="w-full bg-gray-800 p-4 rounded-2xl text-lg" onchange="updateBalanceValue('deposit', ${i}, 'usd', this.value)">
                <p class="text-sm text-gray-400 mt-1">${formatNumber(balances.deposits[i].usd)} $</p>
              </div>
            </div>
          </div>`;
      }
      content.innerHTML = html;
    }

    function renderCategories(content) {
      let html = `<h2 class="text-xl mb-6">Управление категориями</h2>`;

      html += `<div class="mb-10"><h3 class="text-emerald-400 mb-4">Доходы</h3><div class="grid grid-cols-2 gap-3">`;
      incomeCategories.forEach((c, i) => {
        html += `<div class="bg-gray-800 px-4 py-3 rounded-2xl flex justify-between items-center"><span>${c}</span><button onclick="deleteCategory('income', ${i})" class="text-red-400 text-2xl">×</button></div>`;
      });
      html += `</div><div class="flex gap-2 mt-4"><input id="new-income" placeholder="Новая категория" class="flex-1 bg-gray-800 p-4 rounded-2xl"><button onclick="addCategory('income')" class="bg-emerald-600 px-8 rounded-2xl">Добавить</button></div></div>`;

      html += `<div><h3 class="text-red-400 mb-4">Расходы</h3><div class="grid grid-cols-2 gap-3">`;
      expenseCategories.forEach((c, i) => {
        html += `<div class="bg-gray-800 px-4 py-3 rounded-2xl flex justify-between items-center"><span>${c}</span><button onclick="deleteCategory('expense', ${i})" class="text-red-400 text-2xl">×</button></div>`;
      });
      html += `</div><div class="flex gap-2 mt-4"><input id="new-expense" placeholder="Новая категория" class="flex-1 bg-gray-800 p-4 rounded-2xl"><button onclick="addCategory('expense')" class="bg-red-600 px-8 rounded-2xl">Добавить</button></div></div>`;

      content.innerHTML = html;
    }

    window.addCategory = function(type) {
      const input = document.getElementById(type === 'income' ? 'new-income' : 'new-expense');
      if (input && input.value.trim()) {
        if (type === 'income') incomeCategories.push(input.value.trim());
        else expenseCategories.push(input.value.trim());
        saveData();
        renderCategories(document.getElementById('main-content'));
      }
    };

    window.deleteCategory = function(type, index) {
      if (confirm("Удалить категорию?")) {
        if (type === 'income') incomeCategories.splice(index, 1);
        else expenseCategories.splice(index, 1);
        saveData();
        renderCategories(document.getElementById('main-content'));
      }
    };

    window.addTransaction = function() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-content').innerHTML = `
        <h3 class="text-2xl mb-6 text-center">Новая транзакция</h3>
        <div class="space-y-5">
          <div class="flex gap-3">
            <button onclick="setType(this, 'expense')" class="flex-1 py-5 bg-red-600 rounded-3xl text-lg">РАСХОД</button>
            <button onclick="setType(this, 'income')" class="flex-1 py-5 bg-emerald-600 rounded-3xl text-lg">ДОХОД</button>
          </div>
          <input id="amount" type="number" placeholder="Сумма" class="w-full bg-gray-800 p-5 rounded-3xl text-2xl">
          <input id="date" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full bg-gray-800 p-5 rounded-3xl">
          <select id="category" class="w-full bg-gray-800 p-5 rounded-3xl"></select>
          <input id="desc" placeholder="Описание (необязательно)" class="w-full bg-gray-800 p-5 rounded-3xl">
          <div class="flex gap-3 pt-4">
            <button onclick="closeModal()" class="flex-1 py-5 border border-gray-600 rounded-3xl">Отмена</button>
            <button onclick="saveTransaction()" class="flex-1 py-5 bg-emerald-600 rounded-3xl">Сохранить</button>
          </div>
        </div>`;
      window.currentType = 'expense';
      updateCategorySelect('expense');
    };

    function updateCategorySelect(type) {
      const select = document.getElementById('category');
      if (!select) return;
      const cats = type === 'income' ? incomeCategories : expenseCategories;
      select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.setType = function(btn, type) {
      window.currentType = type;
      updateCategorySelect(type);
    };

    window.saveTransaction = function() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount) return alert("Введите сумму!");

      const newTrans = {
        id: Date.now(),
        date: document.getElementById('date').value,
        type: window.currentType || 'expense',
        amount: amount,
        category: document.getElementById('category').value,
        description: document.getElementById('desc').value || ''
      };

      if (window.editingIndex !== undefined) {
        transactions[window.editingIndex] = newTrans;
        delete window.editingIndex;
      } else {
        transactions.unshift(newTrans);
      }

      saveData();
      closeModal();
      showTab(1);
    };

    window.editTransaction = function(index) {
      const t = transactions[index];
      window.editingIndex = index;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-content').innerHTML = `
        <h3 class="text-2xl mb-6 text-center">Редактировать транзакцию</h3>
        <div class="space-y-5">
          <div class="flex gap-3">
            <button onclick="setType(this, 'expense')" class="flex-1 py-5 bg-red-600 rounded-3xl text-lg">РАСХОД</button>
            <button onclick="setType(this, 'income')" class="flex-1 py-5 bg-emerald-600 rounded-3xl text-lg">ДОХОД</button>
          </div>
          <input id="amount" type="number" value="${t.amount}" class="w-full bg-gray-800 p-5 rounded-3xl text-2xl">
          <input id="date" type="date" value="${t.date}" class="w-full bg-gray-800 p-5 rounded-3xl">
          <select id="category" class="w-full bg-gray-800 p-5 rounded-3xl"></select>
          <input id="desc" value="${t.description || ''}" placeholder="Описание" class="w-full bg-gray-800 p-5 rounded-3xl">
          <div class="flex gap-3 pt-4">
            <button onclick="closeModal()" class="flex-1 py-5 border border-gray-600 rounded-3xl">Отмена</button>
            <button onclick="saveTransaction()" class="flex-1 py-5 bg-emerald-600 rounded-3xl">Сохранить изменения</button>
          </div>
        </div>`;
      window.currentType = t.type;
      setTimeout(() => updateCategorySelect(t.type), 50);
    };

    window.deleteTransaction = function(index) {
      if (confirm("Удалить транзакцию?")) {
        transactions.splice(index, 1);
        saveData();
        showTab(1);
      }
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.add('hidden');
      delete window.editingIndex;
    };

    window.exportData = function() {
      const data = {transactions, expenseCategories, incomeCategories, balances};
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `budget-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

    window.importData = function() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.transactions) transactions = data.transactions;
            if (data.expenseCategories) expenseCategories = data.expenseCategories;
            if (data.incomeCategories) incomeCategories = data.incomeCategories;
            if (data.balances) balances = data.balances;
            saveData();
            showTab(1);
            alert("✅ Данные восстановлены!");
          } catch(e) { alert("Ошибка файла"); }
        };
        reader.readAsText(e.target.files[0]);
      };
      input.click();
    };

    window.updateBalanceName = function(type, index, value) {
      if (type === 'card') balances.cardNames[index] = value;
      else balances.depositNames[index] = value;
      saveData();
    };

    window.updateBalanceValue = function(type, index, currency, value) {
      const num = parseFloat(value) || 0;
      if (type === 'card') balances.cards[index][currency] = num;
      else balances.deposits[index][currency] = num;
      saveData();
    };

    showTab(0);
  </script>
</body>
</html>
